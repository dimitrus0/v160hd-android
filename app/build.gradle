plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.roland.v160hdremote'
    compileSdk 34

    defaultConfig {
        applicationId "com.roland.v160hdremote"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
}
