<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roland V-160HD Remote Console</title>
  <style>
    :root {
      --bg-dark: #121418;
      --bg-panel: #1a1d24;
      --border-color: #333a48;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --tally-pgm: #ff3333;
      --tally-pgm-glow: rgba(255, 51, 51, 0.7);
      --tally-pst: #10b981;
      --tally-pst-glow: rgba(16, 185, 129, 0.7);
      --roland-red: #da291c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
    
    header { background: #1c202a; border-bottom: 2px solid #2d3341; padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
    .brand-logo { font-weight: 900; font-size: 1.2rem; letter-spacing: 2px; color: #fff; }
    .brand-logo span { background: var(--roland-red); padding: 2px 6px; border-radius: 4px; font-size: 0.8rem; }
    
    .conn-bar { display: flex; align-items: center; gap: 8px; background: var(--bg-panel); padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border-color); }
    .conn-bar input { background: #0f1115; border: 1px solid var(--border-color); color: #fff; padding: 4px 8px; border-radius: 4px; font-family: monospace; width: 110px; }
    
    .btn { background: #2a303c; color: #e2e8f0; border: 1px solid #475569; padding: 6px 12px; border-radius: 4px; font-size: 0.8rem; font-weight: 700; cursor: pointer; }
    .btn-primary { background: #2563eb; border-color: #3b82f6; color: white; }
    .btn-danger { background: #b91c1c; border-color: #ef4444; color: white; }

    main { padding: 18px 20px; max-width: 1400px; margin: 0 auto; width: 100%; display: grid; grid-template-columns: 1fr 300px; gap: 20px; }
    @media (max-width: 1050px) { main { grid-template-columns: 1fr; } }

    .panel-box { background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .bus-title { font-size: 0.8rem; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 8px; }
    
    .crosspoint-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 8px; }
    .xp-btn { background: linear-gradient(180deg, #2a2f3a 0%, #1e222a 100%); border: 1px solid #3c4454; border-radius: 6px; padding: 12px 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; min-height: 58px; }
    .xp-num { font-size: 1rem; font-weight: 900; }
    .xp-name { font-size: 0.65rem; color: #94a3b8; text-transform: uppercase; margin-top: 2px; }

    .bus-pgm .xp-btn.active { background: linear-gradient(180deg, #e11d48 0%, #be123c 100%); border-color: #fda4af; box-shadow: 0 0 15px var(--tally-pgm-glow); color: #fff; }
    .bus-pst .xp-btn.active { background: linear-gradient(180deg, #059669 0%, #047857 100%); border-color: #6ee7b7; box-shadow: 0 0 15px var(--tally-pst-glow); color: #fff; }

    /* FIXED T-BAR CSS: 0% BOTTOM -> 100% TOP */
    .tbar-wrapper { display: flex; flex-direction: column; align-items: center; background: #14171d; border-radius: 8px; padding: 16px; border: 1px solid var(--border-color); }
    .tbar-track { width: 44px; height: 240px; background: #090a0d; border-radius: 22px; border: 2px solid #282d38; position: relative; cursor: pointer; }
    .tbar-progress { position: absolute; bottom: 0; left: 12px; right: 12px; background: linear-gradient(0deg, var(--roland-red) 0%, #f59e0b 100%); border-radius: 8px; pointer-events: none; height: 0%; }
    .tbar-handle { position: absolute; left: -18px; right: -18px; height: 38px; bottom: 0px; background: linear-gradient(180deg, #64748b 0%, #334155 50%, #1e293b 100%); border: 2px solid #94a3b8; border-radius: 8px; cursor: grab; }

    .trans-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin-top: 14px; }
    .btn-cut { background: #b91c1c; color: white; height: 55px; font-size: 1.1rem; font-weight: 900; border: none; border-radius: 6px; cursor: pointer; }
    .btn-auto { background: #1d4ed8; color: white; height: 55px; font-size: 1.1rem; font-weight: 900; border: none; border-radius: 6px; cursor: pointer; }

    /* CLEAN AUDIO FADER (NO JITTER) */
    .audio-fader-card { display: flex; align-items: center; gap: 14px; background: #14171d; border-radius: 8px; padding: 12px 16px; margin-top: 10px; }
    .fader-vertical { writing-mode: vertical-lr; direction: rtl; width: 28px; height: 160px; accent-color: #3b82f6; cursor: pointer; }
    .db-scale { display: flex; flex-direction: column; justify-content: space-between; height: 160px; font-family: monospace; font-size: 0.75rem; color: #64748b; font-weight: 700; }
    .db-scale span.unity { color: #10b981; }
  </style>
</head>
<body>

  <header>
    <div class="brand-logo">ROLAND <span>V-160HD</span> REMOTE</div>
    <div class="conn-bar">
      <input type="text" id="hostInput" value="127.0.0.1">
      <input type="number" id="portInput" value="8024" style="width: 60px;">
      <input type="password" id="pinInput" placeholder="PIN" style="width: 55px;" maxlength="4">
      <button id="connectBtn" class="btn btn-primary" onclick="toggleConnection()">Connect</button>
      <button class="btn" onclick="syncBankFromSwitcher()">Sync Bank</button>
      <span id="statusText" style="font-size:0.75rem; font-weight:800; color:#94a3b8;">DISCONNECTED</span>
    </div>
  </header>

  <main>
    <div>
      <div style="display:flex; justify-content: space-between; align-items:center; margin-bottom: 12px;">
        <div style="display:flex; gap: 8px;">
          <button id="b1" class="btn btn-primary" onclick="setBank(1)">Bank 1 (1–10)</button>
          <button id="b2" class="btn" onclick="setBank(2)">Bank 2 (11–20)</button>
        </div>
      </div>

      <!-- PGM -->
      <div class="panel-box bus-pgm">
        <div class="bus-title" style="color:var(--tally-pgm);">● PROGRAM (ON AIR)</div>
        <div class="crosspoint-grid" id="pgmGrid"></div>
      </div>

      <!-- PST -->
      <div class="panel-box bus-pst">
        <div class="bus-title" style="color:var(--tally-pst);">● PRESET (PREVIEW)</div>
        <div class="crosspoint-grid" id="pstGrid"></div>
      </div>

      <!-- AUDIO MASTER STRIP (CLEAN) -->
      <div class="panel-box">
        <div class="bus-title">Master Output Audio Level</div>
        <div class="audio-fader-card">
          <input type="range" class="fader-vertical" min="0" max="100" value="80" oninput="updateMasterAudio(this.value)">
          <div class="db-scale">
            <span style="color:#ef4444;">+10 dB</span>
            <span>+6 dB</span>
            <span class="unity">0 dB (Unity)</span>
            <span>-6 dB</span>
            <span>-12 dB</span>
            <span>-20 dB</span>
            <span>-40 dB</span>
            <span>-∞ dB</span>
          </div>
          <div style="margin-left: 20px;">
            <div style="font-size: 0.8rem; color:#94a3b8;">Current Output</div>
            <div id="masterDbText" style="font-size: 1.3rem; font-weight: 900; color:#fff;">0.0 dB</div>
            <button class="btn" style="margin-top: 10px;" onclick="toggleMasterMute()">Mute Master</button>
          </div>
        </div>
      </div>
    </div>

    <!-- TRANSITION / T-BAR -->
    <div>
      <div class="panel-box tbar-wrapper">
        <div style="font-size:0.8rem; font-weight:800; color:#94a3b8; margin-bottom:12px;">TRANSITION BLOCK</div>
        
        <div class="tbar-track" id="tbarTrack">
          <div class="tbar-progress" id="tbarProgress"></div>
          <div class="tbar-handle" id="tbarHandle"></div>
        </div>
        
        <div style="font-family: monospace; font-size: 0.85rem; margin-top: 12px;">
          POS: <span id="tbarPosText">0%</span>
        </div>

        <div class="trans-actions">
          <button class="btn-cut" onclick="executeCut()">CUT</button>
          <button class="btn-auto" onclick="executeAuto()">AUTO</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    const inputLabels = Array.from({length: 20}, (_, i) => `IN ${i + 1}`);
    let currentBank = 1;
    let pgm = 0, pst = 1;
    let ws = null;

    window.addEventListener('DOMContentLoaded', () => {
      renderBuses();
      setupTbar();
    });

    function setBank(b) {
      currentBank = b;
      document.getElementById('b1').className = b === 1 ? 'btn btn-primary' : 'btn';
      document.getElementById('b2').className = b === 2 ? 'btn btn-primary' : 'btn';
      renderBuses();
    }

    function renderBuses() {
      const pGrid = document.getElementById('pgmGrid');
      const sGrid = document.getElementById('pstGrid');
      pGrid.innerHTML = ''; sGrid.innerHTML = '';
      
      const offset = (currentBank - 1) * 10;
      for (let i = 0; i < 10; i++) {
        const actualIdx = offset + i;
        const name = inputLabels[actualIdx];

        const pBtn = document.createElement('div');
        pBtn.className = `xp-btn ${pgm === actualIdx ? 'active' : ''}`;
        pBtn.innerHTML = `<span class="xp-num">${actualIdx + 1}</span><span class="xp-name">${name}</span>`;
        pBtn.onclick = () => { pgm = actualIdx; renderBuses(); sendCmd(`DTH:002100,${actualIdx.toString(16).padStart(2,'0')};`); };
        pGrid.appendChild(pBtn);

        const sBtn = document.createElement('div');
        sBtn.className = `xp-btn ${pst === actualIdx ? 'active' : ''}`;
        sBtn.innerHTML = `<span class="xp-num">${actualIdx + 1}</span><span class="xp-name">${name}</span>`;
        sBtn.onclick = () => { pst = actualIdx; renderBuses(); sendCmd(`DTH:002101,${actualIdx.toString(16).padStart(2,'0')};`); };
        sGrid.appendChild(sBtn);
      }
    }

    // FIXED T-BAR LOGIC: 0% at bottom, 100% at top
    function setupTbar() {
      const track = document.getElementById('tbarTrack');
      const handle = document.getElementById('tbarHandle');
      const progress = document.getElementById('tbarProgress');
      let dragging = false;
      const travel = 240 - 38; // 202px travel distance

      function update(clientY) {
        const rect = track.getBoundingClientRect();
        // Distance from bottom of track to touch/mouse:
        const yFromBottom = rect.bottom - clientY - 19;
        const ratio = Math.max(0, Math.min(1, yFromBottom / travel));
        const pos = Math.round(ratio * 2047);

        handle.style.bottom = `${ratio * travel}px`;
        progress.style.height = `${ratio * 100}%`;
        document.getElementById('tbarPosText').innerText = `${Math.round(ratio * 100)}%`;

        const hi = ((pos >> 7) & 0x0F).toString(16).padStart(2, '0');
        const lo = (pos & 0x7F).toString(16).padStart(2, '0');
        sendCmd(`DTH:002102,${hi}${lo};`);
      }

      handle.addEventListener('mousedown', () => dragging = true);
      window.addEventListener('mousemove', (e) => { if (dragging) update(e.clientY); });
      window.addEventListener('mouseup', () => dragging = false);
    }

    function executeCut() {
      sendCmd('DTH:0B001E,01;');
      setTimeout(() => sendCmd('DTH:0B001E,00;'), 50);
      const temp = pgm; pgm = pst; pst = temp;
      renderBuses();
    }

    function executeAuto() {
      sendCmd('DTH:0B001F,01;');
      setTimeout(() => sendCmd('DTH:0B001F,00;'), 50);
      const handle = document.getElementById('tbarHandle');
      const progress = document.getElementById('tbarProgress');
      const travel = 240 - 38;
      let start = null;

      function step(timestamp) {
        if (!start) start = timestamp;
        const p = Math.min((timestamp - start) / 1000, 1);
        handle.style.bottom = `${p * travel}px`;
        progress.style.height = `${p * 100}%`;
        document.getElementById('tbarPosText').innerText = `${Math.round(p * 100)}%`;

        if (p < 1) {
          requestAnimationFrame(step);
        } else {
          const temp = pgm; pgm = pst; pst = temp;
          renderBuses();
          setTimeout(() => {
            handle.style.bottom = '0px';
            progress.style.height = '0%';
            document.getElementById('tbarPosText').innerText = '0%';
          }, 150);
        }
      }
      requestAnimationFrame(step);
    }

    function updateMasterAudio(val) {
      const v = parseInt(val, 10);
      const db = v >= 80 ? `+${((v - 80) / 2).toFixed(1)} dB` : `-${((80 - v) * 0.8).toFixed(1)} dB`;
      document.getElementById('masterDbText').innerText = v === 0 ? '-∞ dB' : db;
      sendCmd(`DTH:012100,${v.toString(16).padStart(2,'0')};`);
    }

    function syncBankFromSwitcher() {
      sendCmd('RQH:000000,00000A;');
      sendCmd('RQH:000024,00000A;');
    }

    function sendCmd(cmd) {
      if (window.NativeTCP) {
        window.NativeTCP.send(cmd); // Android app hook
        return;
      }
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(cmd + '\n');
      }
    }

    function toggleConnection() {
      if (ws) { ws.close(); ws = null; return; }
      const host = document.getElementById('hostInput').value;
      const port = document.getElementById('portInput').value;
      const pin = document.getElementById('pinInput').value;
      
      ws = new WebSocket(`ws://${host}:${port}`);
      ws.onopen = () => {
        document.getElementById('statusText').innerText = 'ONLINE';
        document.getElementById('statusText').style.color = '#34d399';
        document.getElementById('connectBtn').innerText = 'Disconnect';
        document.getElementById('connectBtn').className = 'btn btn-danger';
        if (pin) ws.send(pin + '\n');
        sendCmd('VER;');
        syncBankFromSwitcher();
      };
      ws.onclose = () => {
        document.getElementById('statusText').innerText = 'DISCONNECTED';
        document.getElementById('statusText').style.color = '#94a3b8';
        document.getElementById('connectBtn').innerText = 'Connect';
        document.getElementById('connectBtn').className = 'btn btn-primary';
      };
    }
  </script>
</body>
</html>
