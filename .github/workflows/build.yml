name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Auto-generate Android Project Structure
        run: |
          # 1. Root settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "RolandV160HDRemote"
          include ':app'
          EOF

          # 2. Root build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          # 3. gradle.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          # 4. Create App folders
          mkdir -p app/src/main/java/com/roland/v160hdremote
          mkdir -p app/src/main/assets

          # 5. app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.roland.v160hdremote'
              compileSdk 34

              defaultConfig {
                  applicationId "com.roland.v160hdremote"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
          }
          EOF

          # 6. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.roland.v160hdremote">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />

              <application
                  android:allowBackup="true"
                  android:label="V-160HD Remote"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 7. MainActivity.kt (Direct TCP socket to port 8023)
          cat << 'EOF' > app/src/main/java/com/roland/v160hdremote/MainActivity.kt
          package com.roland.v160hdremote

          import android.annotation.SuppressLint
          import android.app.Activity
          import android.os.Bundle
          import android.webkit.JavascriptInterface
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import kotlinx.coroutines.*
          import java.io.InputStream
          import java.io.OutputStream
          import java.net.InetSocketAddress
          import java.net.Socket

          class MainActivity : Activity() {
              private lateinit var webView: WebView
              private var socket: Socket? = null
              private var outStream: OutputStream? = null
              private var inStream: InputStream? = null
              private var isConnected = false
              private val scope = CoroutineScope(Dispatchers.IO + Job())

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  webView = WebView(this)
                  setContentView(webView)

                  webView.settings.javaScriptEnabled = true
                  webView.settings.domStorageEnabled = true
                  webView.webViewClient = WebViewClient()

                  webView.addJavascriptInterface(AndroidTCPBridge(), "NativeTCP")
                  webView.loadUrl("file:///android_asset/v160hd_remote.html")
              }

              inner class AndroidTCPBridge {
                  @JavascriptInterface
                  fun connect(ip: String, port: Int, pin: String) {
                      scope.launch {
                          try {
                              socket = Socket()
                              socket?.connect(InetSocketAddress(ip, port), 4000)
                              outStream = socket?.getOutputStream()
                              inStream = socket?.getInputStream()
                              isConnected = true

                              if (pin.isNotEmpty()) {
                                  send(pin + "\n")
                              }
                              send("VER;\n")

                              val buffer = ByteArray(2048)
                              while (isConnected && socket != null) {
                                  val read = inStream?.read(buffer) ?: -1
                                  if (read == -1) break
                              }
                          } catch (_: Exception) {
                              disconnect()
                          }
                      }
                  }

                  @JavascriptInterface
                  fun send(command: String) {
                      scope.launch {
                          try {
                              val formatted = if (command.endsWith("\n")) command else "$command\n"
                              outStream?.write(formatted.toByteArray(Charsets.US_ASCII))
                              outStream?.flush()
                          } catch (_: Exception) {}
                      }
                  }

                  @JavascriptInterface
                  fun disconnect() {
                      isConnected = false
                      try { socket?.close() } catch (_: Exception) {}
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  scope.cancel()
              }
          }
          EOF

          # 8. Copy HTML file into assets
          HTML_SRC=$(find . -maxdepth 3 -name "*v160hd_remote.html" | head -n 1)
          if [ -n "$HTML_SRC" ]; then
            cp "$HTML_SRC" app/src/main/assets/v160hd_remote.html
            echo "Copied HTML from: $HTML_SRC"
          else
            echo "ERROR: v160hd_remote.html was not found in the repository!"
            exit 1
          fi

      - name: Build APK with Gradle
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Roland-V160HD-Remote-APK
          path: app/build/outputs/apk/debug/app-debug.apk
